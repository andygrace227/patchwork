[package]
name = "patchwork-common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
kameo = "0.22.2"
sea-orm = { version = "2", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-json"], default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

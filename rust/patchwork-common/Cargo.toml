[package]
name = "patchwork-common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
kameo = "0.22.2"
sea-orm = { version = "2", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-json"], default-features = false }
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttl_cache = "0.5"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
sea-orm = { version = "2", features = ["sqlx-sqlite"], default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "patchwork-load"
version = "0.1.0"
edition = "2024"

[dependencies]
patchwork-common = { workspace = true }
anyhow = "1.0.104"
bytes = "1"
dotenvy = "0.15"
futures-util = "0.3"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
axum = "0.8"
tempfile = "3"

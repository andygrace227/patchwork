[package]
name = "patchwork-control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
kameo = "0.22.2"
sea-orm = { version = "2", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-json"], default-features = false }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
patchwork-data-plane = { path = "../patchwork-data-plane" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

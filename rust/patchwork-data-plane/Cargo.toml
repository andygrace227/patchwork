[package]
name = "patchwork-data-plane"
version = "0.1.0"
edition = "2024"
default-run = "patchwork-data-plane"

[dependencies]
patchwork-common = { workspace = true }
anyhow = "1.0"
dotenvy = "0.15"
kameo = "0.22.2"
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tokio-stream = { version = "0.1", features = ["net"] }
ringbuffer = "0.16.0"
wal-db = "1.0.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
